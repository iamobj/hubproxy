services:
  hubproxy:
    image: ghcr.io/sky22333/hubproxy
    container_name: hubproxy
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./src/config.toml:/app/config.toml:ro
      # 如启用 [releaseCache]，建议取消下一行注释以持久化缓存目录
      # - ./data/release-cache:/app/cache/releases
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "3"